<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mood Checker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #fce7f3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #6366f1;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .question {
            margin-bottom: 25px;
        }

        .question h3 {
            color: #333;
            margin-bottom: 12px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            background: #fafafa;
        }

        .option:hover {
            border-color: #6366f1;
            background: #f5f3ff;
        }

        .option input {
            margin-right: 10px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #6366f1;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #4f46e5;
        }

        #hasil {
            display: none;
            margin-top: 25px;
            padding: 25px;
            border-radius: 18px;
            background: #f5f3ff;
            text-align: center;
        }

        #emoji {
            font-size: 60px;
            margin: 10px;
        }

        #judulHasil {
            color: #6366f1;
        }

        #deskripsi {
            line-height: 1.6;
            color: #444;
        }

        .reset {
            background: #9ca3af;
        }

        .reset:hover {
            background: #6b7280;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🌈 Mood Checker</h1>

        <p class="subtitle">
            Jawab beberapa pertanyaan untuk mengetahui suasana hatimu hari ini.
        </p>

        <!-- PERTANYAAN 1 -->
        <div class="question">

            <h3>1. Bagaimana perasaanmu hari ini?</h3>

            <div class="options">

                <label class="option">
                    <input type="radio" name="q1" value="senang">
                    😄 Senang dan bersemangat
                </label>

                <label class="option">
                    <input type="radio" name="q1" value="tenang">
                    😌 Tenang dan santai
                </label>

                <label class="option">
                    <input type="radio" name="q1" value="lelah">
                    😴 Lelah dan ingin istirahat
                </label>

                <label class="option">
                    <input type="radio" name="q1" value="sedih">
                    😔 Sedih atau kurang bersemangat
                </label>

            </div>
        </div>


        <!-- PERTANYAAN 2 -->
        <div class="question">

            <h3>2. Kalau punya waktu luang, kamu lebih memilih...</h3>

            <div class="options">

                <label class="option">
                    <input type="radio" name="q2" value="senang">
                    🎮 Bermain atau melakukan hal yang menyenangkan
                </label>

                <label class="option">
                    <input type="radio" name="q2" value="tenang">
                    🎧 Mendengarkan musik atau bersantai
                </label>

                <label class="option">
                    <input type="radio" name="q2" value="lelah">
                    🛌 Tidur atau beristirahat
                </label>

                <label class="option">
                    <input type="radio" name="q2" value="sedih">
                    🌧️ Menyendiri sebentar
                </label>

            </div>
        </div>


        <!-- PERTANYAAN 3 -->
        <div class="question">

            <h3>3. Bagaimana energimu saat ini?</h3>

            <div class="options">

                <label class="option">
                    <input type="radio" name="q3" value="senang">
                    ⚡ Sangat berenergi
                </label>

                <label class="option">
                    <input type="radio" name="q3" value="tenang">
                    🌿 Cukup stabil
                </label>

                <label class="option">
                    <input type="radio" name="q3" value="lelah">
                    🪫 Sedikit lelah
                </label>

                <label class="option">
                    <input type="radio" name="q3" value="sedih">
                    💭 Kurang bersemangat
                </label>

            </div>
        </div>


        <!-- PERTANYAAN 4 -->
        <div class="question">

            <h3>4. Kalau ada teman mengajak pergi, kamu...</h3>

            <div class="options">

                <label class="option">
                    <input type="radio" name="q4" value="senang">
                    🥳 Langsung ikut!
                </label>

                <label class="option">
                    <input type="radio" name="q4" value="tenang">
                    🙂 Ikut kalau sedang ingin
                </label>

                <label class="option">
                    <input type="radio" name="q4" value="lelah">
                    😴 Lebih memilih istirahat
                </label>

                <label class="option">
                    <input type="radio" name="q4" value="sedih">
                    🙁 Lebih memilih sendiri dulu
                </label>

            </div>
        </div>


        <button onclick="cekMood()">
            🔍 Lihat Mood Saya
        </button>


        <!-- HASIL -->
        <div id="hasil">

            <div id="emoji"></div>

            <h2 id="judulHasil"></h2>

            <p id="deskripsi"></p>

            <button class="reset" onclick="ulang()">
                🔄 Coba Lagi
            </button>

        </div>

    </div>


    <script>

        function cekMood() {

            let pertanyaan = ["q1", "q2", "q3", "q4"];

            let jumlah = {
                senang: 0,
                tenang: 0,
                lelah: 0,
                sedih: 0
            };


            // Mengambil semua jawaban
            for (let i = 0; i < pertanyaan.length; i++) {

                let jawaban = document.querySelector(
                    'input[name="' + pertanyaan[i] + '"]:checked'
                );

                // Jika belum menjawab
                if (!jawaban) {

                    alert(
                        "Yuk jawab semua pertanyaan terlebih dahulu 😊"
                    );

                    return;
                }

                jumlah[jawaban.value]++;
            }


            // Menentukan mood terbanyak
            let mood = "senang";

            if (jumlah.tenang > jumlah[mood]) {
                mood = "tenang";
            }

            if (jumlah.lelah > jumlah[mood]) {
                mood = "lelah";
            }

            if (jumlah.sedih > jumlah[mood]) {
                mood = "sedih";
            }


            // Menampilkan hasil
            let emoji = "";
            let judul = "";
            let deskripsi = "";


            if (mood === "senang") {

                emoji = "😄";

                judul = "Kamu Lagi Ceria!";

                deskripsi =
                    "Jawabanmu menunjukkan suasana hati yang " +
                    "cukup ceria dan penuh semangat. " +
                    "Nikmati kegiatan yang membuatmu senang!";

            }


            else if (mood === "tenang") {

                emoji = "😌";

                judul = "Kamu Lagi Tenang";

                deskripsi =
                    "Kamu terlihat sedang berada dalam " +
                    "suasana hati yang tenang dan santai. " +
                    "Pertahankan suasana positif ini.";

            }


            else if (mood === "lelah") {

                emoji = "😴";

                judul = "Kamu Lagi Butuh Istirahat";

                deskripsi =
                    "Jawabanmu lebih banyak menunjukkan " +
                    "rasa lelah. Coba luangkan waktu untuk " +
                    "beristirahat dan melakukan kegiatan ringan.";

            }


            else {

                emoji = "😔";

                judul = "Kamu Lagi Kurang Bersemangat";

                deskripsi =
                    "Jawabanmu menunjukkan suasana hati yang " +
                    "kurang bersemangat. Tidak apa-apa kalau " +
                    "kamu ingin mengambil waktu untuk diri sendiri.";

            }


            document.getElementById("emoji").textContent = emoji;

            document.getElementById("judulHasil").textContent = judul;

            document.getElementById("deskripsi").textContent = deskripsi;

            document.getElementById("hasil").style.display = "block";
        }


        function ulang() {

            document.querySelectorAll(
                'input[type="radio"]'
            ).forEach(function(input) {

                input.checked = false;

            });

            document.getElementById("hasil").style.display = "none";
        }

    </script>

</body>
</html>
